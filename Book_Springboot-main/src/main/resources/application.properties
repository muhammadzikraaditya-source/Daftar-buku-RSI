spring.application.name=contoh-daftar-buku
server.port=8080

# Database H2 in-memory (hilang saat aplikasi dimatikan)
spring.datasource.url=jdbc:h2:mem:perpustakaan
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Tabel dibuat otomatis dari @Entity, lalu data.sql dijalankan
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
